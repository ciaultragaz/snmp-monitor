[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snmp-monitor"
version = "0.1.0"
description = "Monitor SNMP — GET e WALK (ciclo 1)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ultragaz 24H" }]
dependencies = [
    "pysnmp>=7.1,<8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
snmp-monitor = "snmp_monitor.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
